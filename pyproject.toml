[tool.poetry]
name = "hexhound"
version = "0.1.0"
description = "HexHound: blockchain forensics CLI + UI for tracing tainted funds."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "hexhound" }
]
include = [
    "hexhound/ui/**/*"
]

[tool.poetry.dependencies]
python = "^3.10"
typer = { extras = ["all"], version = "^0.12.0" }
cmd2 = "^2.5.0"
Flask = "^3.0.0"
requests = "^2.32.0"
rich = "^13.7.0"
tqdm = "^4.67.1"
click = "8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
black = "^24.0.0"
ruff = "^0.6.5"

[tool.poetry.scripts]
hexhound = "hexhound.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
